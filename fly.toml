# fly.toml app configuration file generated for isisender on 2026-10-28T21:45:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'isisender'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  IDLE_MINUTES = '10'

[[mounts]]
  source = 'isisender_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
